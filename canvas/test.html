<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理商销售系统 - 测试页面</title>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 10px; }
        .config { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .config label { display: block; margin-bottom: 8px; font-weight: 500; }
        .config input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn { padding: 10px 20px; background: #409eff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #66b1ff; }
        .btn-success { background: #67c23a; }
        .btn-success:hover { background: #85ce61; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h3 { color: #303133; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ebeef5; }
        .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .item:last-child { border-bottom: none; }
        .item span:first-child { color: #909399; }
        .item span:last-child { color: #303133; font-weight: 500; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .tag-admin { background: #f56c6c; color: white; }
        .tag-sales { background: #e6a23c; color: white; }
        .tag-agent { background: #409eff; color: white; }
        .tag-customer { background: #67c23a; color: white; }
        .actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .log { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        .status { padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .status-ok { background: #67c23a; color: white; }
        .status-error { background: #f56c6c; color: white; }
        .status-warn { background: #e6a23c; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ebeef5; }
        th { background: #fafafa; color: #909399; font-weight: 500; }
        tr:hover { background: #f5f7fa; }
        .money { color: #f56c6c; font-weight: bold; }
        .actions-cell { display: flex; gap: 5px; }
        .actions-cell button { padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 代理商销售管理系统</h1>
        <p style="color: #909399; margin-bottom: 20px;">浏览器直接访问版本 - 无需SophCLAW内置浏览器</p>

        <div class="config">
            <label>API 服务器地址</label>
            <input type="text" id="apiUrl" placeholder="例如: http://10.130.101.197:8000" value="http://10.130.101.197:8000">
            <div style="margin-top: 15px;">
                <button class="btn" onclick="connect()">连接服务器</button>
                <button class="btn btn-success" onclick="testAll()">测试全部功能</button>
            </div>
        </div>

        <div id="status" class="status status-warn" style="display:none;"></div>

        <div class="grid" id="dataGrid" style="display:none;">
            <div class="card">
                <h3>📦 产品列表</h3>
                <div id="products"></div>
            </div>
            <div class="card">
                <h3>🏢 代理商列表</h3>
                <div id="agents"></div>
            </div>
            <div class="card">
                <h3>👥 客户列表</h3>
                <div id="customers"></div>
            </div>
            <div class="card">
                <h3>📦 库存</h3>
                <div id="inventory"></div>
            </div>
        </div>

        <div class="card" id="ordersCard" style="display:none; margin-bottom: 20px;">
            <h3>📋 订单列表</h3>
            <table id="ordersTable">
                <thead><tr><th>ID</th><th>客户</th><th>产品</th><th>数量</th><th>单价</th><th>总价</th><th>状态</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card" id="performanceCard" style="display:none; margin-bottom: 20px;">
            <h3>🏆 业绩列表</h3>
            <table id="perfTable">
                <thead><tr><th>ID</th><th>代理商</th><th>数量</th><th>奖励</th><th>状态</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card" id="usersCard" style="display:none; margin-bottom: 20px;">
            <h3>👤 用户列表</h3>
            <table id="usersTable">
                <thead><tr><th>ID</th><th>用户名</th><th>角色</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <h3>📝 操作日志</h3>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        let apiUrl = '';
        let token = '';

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f56c6c' : type === 'success' ? '#67c23a' : '#909399';
            document.getElementById('log').innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.style.display = 'block';
            el.className = 'status status-' + type;
            el.textContent = msg;
        }

        async function connect() {
            apiUrl = document.getElementById('apiUrl').value.trim();
            if (!apiUrl) {
                log('请输入API服务器地址', 'error');
                return;
            }

            log('正在连接服务器: ' + apiUrl);

            try {
                // 测试健康检查
                const health = await axios.get(apiUrl + '/api/health');
                log('服务器健康检查通过', 'success');
                showStatus('✅ 服务器已连接 - ' + apiUrl, 'ok');

                // 登录获取Token
                const loginRes = await axios.post(apiUrl + '/api/v1/auth/login', {
                    username: 'admin',
                    password: 'admin123'
                });
                token = loginRes.data.access_token;
                log('管理员登录成功，Token获取成功', 'success');

                // 加载所有数据
                await loadAllData();

            } catch (error) {
                log('连接失败: ' + (error.response?.data?.detail || error.message), 'error');
                showStatus('❌ 连接失败: ' + (error.response?.data?.detail || error.message), 'error');
            }
        }

        async function loadAllData() {
            log('开始加载所有数据...');

            const headers = { Authorization: 'Bearer ' + token };

            try {
                // 并行加载
                const [products, agents, customers, inventory, orders, performance, users] = await Promise.all([
                    axios.get(apiUrl + '/api/v1/products', { headers }),
                    axios.get(apiUrl + '/api/v1/agents', { headers }),
                    axios.get(apiUrl + '/api/v1/customers', { headers }),
                    axios.get(apiUrl + '/api/v1/inventory', { headers }),
                    axios.get(apiUrl + '/api/v1/orders', { headers }),
                    axios.get(apiUrl + '/api/v1/performance', { headers }),
                    axios.get(apiUrl + '/api/v1/users', { headers })
                ]);

                renderProducts(products.data);
                renderAgents(agents.data);
                renderCustomers(customers.data);
                renderInventory(inventory.data);
                renderOrders(orders.data);
                renderPerformance(performance.data);
                renderUsers(users.data);

                document.getElementById('dataGrid').style.display = 'grid';
                document.getElementById('ordersCard').style.display = 'block';
                document.getElementById('performanceCard').style.display = 'block';
                document.getElementById('usersCard').style.display = 'block';

                log('所有数据加载完成!', 'success');
                showStatus('✅ 数据加载完成!', 'ok');

            } catch (error) {
                log('加载数据失败: ' + (error.response?.data?.detail || error.message), 'error');
            }
        }

        async function testAll() {
            log('========== 开始完整功能测试 ==========');
            await connect();
            log('========== 测试完成 ==========');
        }

        function renderProducts(data) {
            const html = data.map(p => `
                <div class="item">
                    <span>${p.name}</span>
                    <span>LP:¥${p.lp_price} PDC:¥${p.pdc_price}</span>
                </div>
            `).join('');
            document.getElementById('products').innerHTML = html || '<p style="color:#909399;">暂无数据</p>';
        }

        function renderAgents(data) {
            const html = data.map(a => `
                <div class="item">
                    <span>${a.name}</span>
                    <span class="money">¥${a.balance?.toFixed(2)}</span>
                </div>
            `).join('');
            document.getElementById('agents').innerHTML = html || '<p style="color:#909399;">暂无数据</p>';
        }

        function renderCustomers(data) {
            const html = data.map(c => `
                <div class="item">
                    <span>${c.name}</span>
                    <span>代理商#${c.agent_id}</span>
                </div>
            `).join('');
            document.getElementById('customers').innerHTML = html || '<p style="color:#909399;">暂无数据</p>';
        }

        function renderInventory(data) {
            const html = data.map(i => `
                <div class="item">
                    <span>产品#${i.product_id}</span>
                    <span>${i.quantity} 台</span>
                </div>
            `).join('');
            document.getElementById('inventory').innerHTML = html || '<p style="color:#909399;">暂无数据</p>';
        }

        function renderOrders(data) {
            const tbody = document.querySelector('#ordersTable tbody');
            tbody.innerHTML = data.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>客户#${o.customer_id}</td>
                    <td>产品#${o.product_id}</td>
                    <td>${o.quantity}</td>
                    <td>¥${o.unit_price}</td>
                    <td class="money">¥${(o.quantity * o.unit_price).toFixed(2)}</td>
                    <td><span class="tag" style="background:${o.status==='completed'?'#67c23a':o.status==='cancelled'?'#f56c6c':'#e6a23c'};color:white;">${o.status}</span></td>
                </tr>
            `).join('') || '<tr><td colspan="7" style="text-align:center;color:#909399;">暂无订单</td></tr>';
        }

        function renderPerformance(data) {
            const tbody = document.querySelector('#perfTable tbody');
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td>代理商#${p.agent_id}</td>
                    <td>${p.quantity}</td>
                    <td class="money">¥${p.reward_amount}</td>
                    <td><span class="tag" style="background:${p.status==='approved'?'#67c23a':'#e6a23c'};color:white;">${p.status}</span></td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center;color:#909399;">暂无业绩</td></tr>';
        }

        function renderUsers(data) {
            const tbody = document.querySelector('#usersTable tbody');
            const colors = { 'admin': '#f56c6c', 'sales': '#e6a23c', 'agent': '#409eff', 'customer': '#67c23a' };
            tbody.innerHTML = data.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td><span class="tag" style="background:${colors[u.role]||'#909399'};color:white;">${u.role}</span></td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#909399;">暂无用户</td></tr>';
        }
    </script>
</body>
</html>
